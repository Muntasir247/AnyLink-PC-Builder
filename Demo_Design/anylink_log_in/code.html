</div>

<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function setActiveTab(tab) {
    const tabLogin = document.getElementById('tabLogin');
    const tabSignup = document.getElementById('tabSignup');
    if (!tabLogin || !tabSignup) return;

    if (tab === 'login') {
      tabLogin.className = "flex-1 py-1.5 text-center font-body-sm text-body-sm text-white bg-white/[0.12] rounded-lg shadow-[inset_0_1px_0_0_rgba(255,255,255,0.2),0_4px_12px_rgba(0,0,0,0.25)] transition-all duration-200 cursor-pointer";
      tabSignup.className = "flex-1 py-1.5 text-center font-body-sm text-body-sm text-white/50 hover:text-white/80 rounded-lg transition-all duration-200 cursor-pointer";
    } else {
      tabSignup.className = "flex-1 py-1.5 text-center font-body-sm text-body-sm text-white bg-white/[0.12] rounded-lg shadow-[inset_0_1px_0_0_rgba(255,255,255,0.2),0_4px_12px_rgba(0,0,0,0.25)] transition-all duration-200 cursor-pointer";
      tabLogin.className = "flex-1 py-1.5 text-center font-body-sm text-body-sm text-white/50 hover:text-white/80 rounded-lg transition-all duration-200 cursor-pointer";
    }
  }
