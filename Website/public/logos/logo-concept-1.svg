<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#0A0A0A" rx="96"/>
  <!-- Subtle circular grid / PCB guide -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- PCB Traces extending outwards -->
  <path d="M 120 256 L 64 256" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  <circle cx="56" cy="256" r="4" fill="#FFFFFF" fill-opacity="0.6"/>

  <path d="M 392 256 L 448 256" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  <circle cx="456" cy="256" r="4" fill="#FFFFFF" fill-opacity="0.6"/>

  <path d="M 180 140 L 140 100 L 90 100" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="82" cy="100" r="3.5" fill="#FFFFFF" fill-opacity="0.5"/>

  <path d="M 332 372 L 372 412 L 422 412" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="430" cy="412" r="3.5" fill="#FFFFFF" fill-opacity="0.5"/>

  <path d="M 332 140 L 372 100 L 412 100" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="420" cy="100" r="3.5" fill="#FFFFFF" fill-opacity="0.5"/>

  <path d="M 180 372 L 140 412 L 100 412" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="92" cy="412" r="3.5" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Interlocking Chain Link with Circuit Matrix -->
  <!-- Left Link Loop -->
  <rect x="140" y="196" width="150" height="120" rx="60" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  <!-- Right Link Loop -->
  <rect x="222" y="196" width="150" height="120" rx="60" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>

  <!-- Link Interlock Gap / Depth Masking -->
  <path d="M 222 236 L 222 276" stroke="#0A0A0A" stroke-width="28" stroke-linecap="round"/>
  <path d="M 222 236 L 222 276" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>

  <!-- Central Circuit Contact Nodes / Bus Lines -->
  <line x1="240" y1="256" x2="272" y2="256" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="215" cy="256" r="6" fill="#FFFFFF"/>
  <circle cx="297" cy="256" r="6" fill="#FFFFFF"/>
  
  <!-- Micro VIA Nodes inside links -->
  <circle cx="180" cy="256" r="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="180" cy="256" r="3" fill="#FFFFFF"/>

  <circle cx="332" cy="256" r="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="332" cy="256" r="3" fill="#FFFFFF"/>
</svg>

