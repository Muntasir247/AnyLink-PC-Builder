<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#0A0A0A" rx="96"/>

  <!-- Outer Silicon Package / Heatspreader Chamfered Outline -->
  <rect x="106" y="106" width="300" height="300" rx="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Precision Corner Pin 1 Alignment Triangles -->
  <polygon points="126,126 146,126 126,146" fill="#FFFFFF" fill-opacity="0.8"/>
  
  <!-- Outer Socket Retention Bracket / Clamp Frame -->
  <rect x="136" y="136" width="240" height="240" rx="36" fill="none" stroke="#FFFFFF" stroke-width="16"/>

  <!-- Cutouts creating the interlocking link mechanic from socket geometry -->
  <!-- Upper link hook -->
  <path d="M 210 200 L 270 200 C 298 200 320 222 320 250 C 320 278 298 300 270 300 L 246 300" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Lower link hook -->
  <path d="M 302 312 L 242 312 C 214 312 192 290 192 262 C 192 234 214 212 242 212 L 266 212" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

  <!-- LGA Socket Pad Grid Arrays (Subtle Pin Contact Matrix) -->
  <g fill="#FFFFFF" fill-opacity="0.35">
    <circle cx="172" cy="172" r="3"/>
    <circle cx="192" cy="172" r="3"/>
    <circle cx="320" cy="172" r="3"/>
    <circle cx="340" cy="172" r="3"/>
    
    <circle cx="172" cy="340" r="3"/>
    <circle cx="192" cy="340" r="3"/>
    <circle cx="320" cy="340" r="3"/>
    <circle cx="340" cy="340" r="3"/>

    <circle cx="172" cy="192" r="3"/>
    <circle cx="340" cy="192" r="3"/>
    <circle cx="172" cy="320" r="3"/>
    <circle cx="340" cy="320" r="3"/>
  </g>

  <!-- Central Locking Latch Notch -->
  <circle cx="256" cy="256" r="14" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="256" cy="256" r="3" fill="#FFFFFF"/>
</svg>
