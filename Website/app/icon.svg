<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#0A0A0A" rx="108"/>

  <!-- Geometric Isogrid Accent Lines -->
  <line x1="256" y1="80" x2="256" y2="432" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="96" y1="256" x2="416" y2="256" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Left Leg of 'A' with 45-degree PCIe Trace Chamfers -->
  <path d="M 256 112 L 140 376 L 194 376 L 232 290 L 280 290" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Leg forming the forward Link Connector Arrow -->
  <path d="M 256 112 L 372 376 L 318 376 L 292 316" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic Crossbar: Forward Hyperlink Pointer / Link Node -->
  <path d="M 190 270 L 330 270 M 294 234 L 330 270 L 294 306" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Precision Connector Pin Points at Base -->
  <circle cx="140" cy="376" r="8" fill="#FFFFFF"/>
  <circle cx="372" cy="376" r="8" fill="#FFFFFF"/>
  <circle cx="256" cy="112" r="10" fill="#FFFFFF"/>

  <!-- Speed Trace Accent Lines -->
  <path d="M 112 376 L 80 376" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
  <path d="M 400 376 L 432 376" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>
</svg>

